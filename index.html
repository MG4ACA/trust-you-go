<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trust You Go - Sri Lankan Travel Experience</title>

    <!-- Primary SEO -->
    <meta name="application-name" content="Trust You Go" />
    <meta
      name="description"
      content="Trust You Go — personalized Sri Lanka travel experiences, authentic tours, curated itineraries, and trusted local guides. Book your unforgettable trip today."
    />
    <meta
      name="keywords"
      content="Trust You Go, Sri Lanka travel, Sri Lanka tours, Sri Lankan travel agency, custom travel packages, Sri Lanka holiday packages"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.trustyou-go.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trust You Go" />
    <meta property="og:title" content="Trust You Go - Sri Lankan Travel Experience" />
    <meta
      property="og:description"
      content="Personalized Sri Lanka travel experiences, curated itineraries, and trusted local guides. Explore, book, and travel with confidence."
    />
    <meta property="og:url" content="https://www.trustyou-go.com/" />
    <meta property="og:image" content="https://www.trustyou-go.com/social-preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trust You Go - Sri Lankan Travel Experience" />
    <meta
      name="twitter:description"
      content="Personalized Sri Lanka travel experiences, curated itineraries, and trusted local guides."
    />
    <meta name="twitter:image" content="https://www.trustyou-go.com/social-preview.png" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Structured data: Website and Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "url": "https://www.trustyou-go.com",
        "name": "Trust You Go",
        "alternateName": "TrustYou-Go",
        "logo": "https://www.trustyou-go.com/social-preview.png",
        "description": "Sri Lankan Travel Experience: Authentic tours and personalized travel experiences",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "No56, Aylesbury street, Niesden",
          "addressLocality": "London",
          "addressCountry": "UK"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+44 7 444 879 173",
          "contactType": "customer service",
          "email": "hello@trustyou-go.com"
        },
        "brand": {
          "@type": "Brand",
          "name": "Trust You Go"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://www.trustyou-go.com",
        "name": "Trust You Go",
        "alternateName": "TrustYou-Go",
        "headline": "Sri Lankan Travel Experience: Trust You Go",
        "description": "Personalized Sri Lanka travel experiences and authentic tours by Trust You Go",
        "publisher": {
          "@type": "Organization",
          "name": "Trust You Go",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.trustyou-go.com/social-preview.png"
          }
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.trustyou-go.com/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "mainEntity": [
          {
            "@type": "SiteNavigationElement",
            "name": "Book Now",
            "url": "https://www.trustyou-go.com/booking",
            "description": "Book your personalized Sri Lankan travel experience"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "About Us",
            "url": "https://www.trustyou-go.com/about",
            "description": "Learn more about Trust You Go and our commitment to authentic Sri Lankan travel experiences"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "Contact Us",
            "url": "https://www.trustyou-go.com/contact",
            "description": "Get in touch with us for personalized Sri Lankan travel experiences"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "Gallery",
            "url": "https://www.trustyou-go.com/gallery",
            "description": "Beautiful photos of Sri Lankan destinations and experiences"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "Learn About Sri Lanka",
            "url": "https://www.trustyou-go.com/learn-about-sri-lanka",
            "description": "Discover the beauty and culture of Sri Lanka through our comprehensive guide"
          }
        ]
      }
    </script>

    <!-- NOTE: Replace trustyou-go with your real domain and upload a social-preview.png at site root for rich previews -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
