<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trust You Go - Sri Lankan Travel Experience</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Trust You Go — personalized Sri Lanka travel experiences, authentic tours, curated itineraries, and trusted local guides. Book your unforgettable trip today."
    />
    <meta
      name="keywords"
      content="Sri Lanka travel, Sri Lanka tours, Trust You Go, personalized travel, best Sri Lanka experiences"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.trustyou-go.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trust You Go - Sri Lankan Travel Experience" />
    <meta
      property="og:description"
      content="Personalized Sri Lanka travel experiences, curated itineraries, and trusted local guides. Explore, book, and travel with confidence."
    />
    <meta property="og:url" content="https://www.trustyou-go.com/" />
    <meta property="og:image" content="https://www.trustyou-go.com/social-preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trust You Go - Sri Lankan Travel Experience" />
    <meta
      name="twitter:description"
      content="Personalized Sri Lanka travel experiences, curated itineraries, and trusted local guides."
    />
    <meta name="twitter:image" content="https://www.trustyou-go.com/social-preview.png" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Structured data: Website and Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "url": "https://www.trustyou-go.com",
        "name": "Trust You Go",
        "logo": "https://www.trustyou-go.com/social-preview.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://www.trustyou-go.com",
        "name": "Trust You Go",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.trustyou-go.com/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- NOTE: Replace trustyou-go with your real domain and upload a social-preview.png at site root for rich previews -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
